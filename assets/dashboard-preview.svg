<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Agentic SOC Investigator dashboard preview</title><desc id="desc">Static synthetic dashboard preview for evidence-grounded SOC investigation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131b"/><stop offset="1" stop-color="#102b32"/></linearGradient></defs><rect width="1200" height="640" rx="24" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="30" font-weight="800" fill="#f8fafc">Agentic SOC Investigator</text><text x="48" y="87" font-size="13" font-weight="700" letter-spacing="1.5" fill="#5eead4">EVIDENCE · HYPOTHESES · ATT&amp;CK · HUMAN APPROVAL</text><text x="1148" y="63" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8">STATIC / SYNTHETIC PREVIEW</text><rect x="48" y="118" width="255" height="92" rx="15" fill="#0d2027" stroke="#28505b"/><text x="68" y="147" font-size="11" font-weight="700" fill="#94a3b8">TELEMETRY</text><text x="68" y="184" font-size="24" font-weight="800" fill="#f8fafc">MULTI-SOURCE</text><rect x="323" y="118" width="255" height="92" rx="15" fill="#0d2027" stroke="#28505b"/><text x="343" y="147" font-size="11" font-weight="700" fill="#94a3b8">INVESTIGATION</text><text x="343" y="184" font-size="24" font-weight="800" fill="#5eead4">EVIDENCE-GROUNDED</text><rect x="598" y="118" width="255" height="92" rx="15" fill="#0d2027" stroke="#28505b"/><text x="618" y="147" font-size="11" font-weight="700" fill="#94a3b8">MAPPING</text><text x="618" y="184" font-size="24" font-weight="800" fill="#93c5fd">MITRE ATT&amp;CK</text><rect x="873" y="118" width="279" height="92" rx="15" fill="#0d2027" stroke="#28505b"/><text x="893" y="147" font-size="11" font-weight="700" fill="#94a3b8">RESPONSE</text><text x="893" y="184" font-size="24" font-weight="800" fill="#fbbf24">HUMAN-GATED</text><rect x="48" y="236" width="535" height="306" rx="18" fill="#0b1a20" stroke="#28505b"/><text x="72" y="272" font-size="18" font-weight="800" fill="#f8fafc">Investigation evidence</text><text x="72" y="298" font-size="12" fill="#94a3b8">Identity · endpoint · cloud · OAuth · threat intel</text><circle cx="78" cy="343" r="6" fill="#5eead4"/><text x="96" y="348" font-size="14" font-weight="650" fill="#dbeafe">Competing compromise and benign hypotheses</text><circle cx="78" cy="391" r="6" fill="#60a5fa"/><text x="96" y="396" font-size="14" font-weight="650" fill="#dbeafe">Event IDs, source labels and evidence provenance</text><circle cx="78" cy="439" r="6" fill="#a78bfa"/><text x="96" y="444" font-size="14" font-weight="650" fill="#dbeafe">Entity-event-technique graph relationships</text><circle cx="78" cy="487" r="6" fill="#f59e0b"/><text x="96" y="492" font-size="14" font-weight="650" fill="#dbeafe">Recommendations remain outside autonomous execution</text><rect x="607" y="236" width="545" height="306" rx="18" fill="#0b1a20" stroke="#28505b"/><text x="631" y="272" font-size="18" font-weight="800" fill="#f8fafc">Analyst workflow</text><text x="631" y="298" font-size="12" fill="#94a3b8">Collect → correlate → explain → review</text><rect x="631" y="330" width="472" height="44" rx="11" fill="#102c30" stroke="#0f766e"/><text x="650" y="358" font-size="13" font-weight="800" fill="#5eead4">1 · NORMALIZE + VALIDATE SECURITY EVENTS</text><rect x="631" y="389" width="472" height="44" rx="11" fill="#15243a" stroke="#1d4ed8"/><text x="650" y="417" font-size="13" font-weight="800" fill="#93c5fd">2 · RANK HYPOTHESES + MAP ATT&amp;CK</text><rect x="631" y="448" width="472" height="44" rx="11" fill="#211c38" stroke="#6d28d9"/><text x="650" y="476" font-size="13" font-weight="800" fill="#c4b5fd">3 · CITE EVIDENCE + EXPOSE GRAPH CONTEXT</text><rect x="631" y="507" width="472" height="28" rx="10" fill="#302410" stroke="#a16207"/><text x="650" y="526" font-size="12" font-weight="800" fill="#fbbf24">ANALYST APPROVAL BEFORE CONSEQUENT ACTION</text><text x="48" y="592" font-size="12" fill="#94a3b8">Preview summarizes synthetic investigation mechanics; offline fixture results are not production SOC effectiveness claims.</text></g></svg>